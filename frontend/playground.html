<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آزمایشگاه | دانا</title>
<link rel="stylesheet" href="tailwind.css">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<script src="js/api.js"></script>
</head>
<body class="bg-base text-ink font-sans">
<div class="flex min-h-screen">

  <!-- ===== سایدبار ===== -->
  <aside class="w-60 shrink-0 bg-surface border-l border-line flex flex-col">
    <div class="h-16 flex items-center gap-2 px-5 border-b border-line">
      <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="5" r="2.4" fill="#e8a33d"/>
        <circle cx="5" cy="20" r="2.4" fill="#4dd6c4"/>
        <circle cx="23" cy="20" r="2.4" fill="#4dd6c4"/>
        <path d="M14 7.2 6.2 18.5M14 7.2 21.8 18.5M6.6 20h14.8" stroke="#2a2d3e" stroke-width="1.4"/>
      </svg>
      <span class="font-bold">دانا</span>
    </div>

    <nav class="flex-1 py-4 px-3 space-y-1 text-sm">
      <a href="dashboard.html" class="nav-item flex items-center gap-2.5 px-3 py-2.5 rounded-md text-muted hover:text-ink">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>
        داشبورد
      </a>
      <a href="connection.html" class="nav-item flex items-center gap-2.5 px-3 py-2.5 rounded-md text-muted hover:text-ink">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v4M15 3v4"/><path d="M6 7h12v3a6 6 0 0 1-12 0V7Z"/><path d="M12 16v5"/></svg>
        اتصال مدل
      </a>
      <a href="knowledge_base.html" class="nav-item flex items-center gap-2.5 px-3 py-2.5 rounded-md text-muted hover:text-ink">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3Z"/><path d="M4 7v10c0 1.7 3.6 3 8 3s8-1.3 8-3V7"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
        مخزن دانش
      </a>
      <a href="settings.html" class="nav-item flex items-center gap-2.5 px-3 py-2.5 rounded-md text-muted hover:text-ink">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 18h2M8 18h12M4 12h6M14 12h6"/><circle cx="16" cy="6" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></svg>
        شخصی‌سازی و ویجت
      </a>
      <a href="playground.html" data-active="true" class="nav-item flex items-center gap-2.5 px-3 py-2.5 rounded-md text-ink">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5.5 9.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-2.5L14 9V3"/><path d="M7.5 15h9"/></svg>
        آزمایشگاه
      </a>
    </nav>

    <div class="p-3 border-t border-line space-y-1">
      <a href="login.html" data-logout class="flex items-center gap-2.5 px-3 py-2.5 rounded-md text-muted hover:text-danger text-sm transition">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        خروج
      </a>
    </div>
  </aside>

  <!-- ===== محتوای اصلی ===== -->
  <div class="flex-1 flex flex-col min-w-0">

    <header class="h-16 border-b border-line flex items-center justify-between px-6 shrink-0">
      <h1 class="font-bold text-lg">آزمایشگاه تست</h1>
      <div data-avatar class="w-8 h-8 rounded-full bg-raised border border-line flex items-center justify-center text-xs font-medium">آ</div>
    </header>

    <main class="flex-1 p-6 overflow-y-auto enter flex flex-col min-h-0">

      <!-- ورودی‌های تب (مخفی) — باید هم‌سطح با pg-panels باشن تا سلکتور ~ در style.css کار کنه -->
      <input type="radio" name="pg-tab" id="pg-tab-chat" class="hidden" checked>
      <input type="radio" name="pg-tab" id="pg-tab-search" class="hidden">

      <!-- تب‌های موبایل (فقط زیر lg دیده می‌شن) -->
      <div class="tabs lg:hidden mb-4">
        <div class="pg-tab-labels flex gap-2 bg-surface border border-line rounded-md p-1 text-sm">
          <label for="pg-tab-chat" class="flex-1 text-center rounded-md py-2 text-muted transition">تست گفت‌وگو</label>
          <label for="pg-tab-search" class="flex-1 text-center rounded-md py-2 text-muted transition">جستجوی معنایی</label>
        </div>
      </div>

      <div class="pg-panels grid lg:grid-cols-2 gap-6 flex-1 min-h-0">

        <!-- پنل چت -->
        <section id="pg-panel-chat" class="flex-col bg-surface border border-line rounded-md min-h-[28rem] lg:min-h-0">
          <div class="px-5 py-3.5 border-b border-line flex items-center justify-between">
            <div>
              <p class="font-medium text-sm">تست گفت‌وگو</p>
              <p class="text-xs text-muted mt-0.5">دقیقاً همون چیزیه که کاربر نهایی توی ویجت می‌بینه</p>
            </div>
            <button id="chat-clear" type="button" class="text-xs text-muted hover:text-ink">پاک کردن</button>
          </div>

          <div id="chat-log" class="flex-1 p-4 space-y-3 overflow-y-auto"></div>

          <form id="chat-form" class="p-3 border-t border-line flex items-center gap-2">
            <input id="chat-input" autocomplete="off" type="text" placeholder="سوالت رو بنویس..."
              class="flex-1 bg-raised border border-line rounded-md px-3.5 py-2.5 text-sm focus:border-accent focus:outline-none">
            <button type="submit" aria-label="ارسال"
              class="shrink-0 w-10 h-10 rounded-md bg-accent flex items-center justify-center hover:brightness-110 transition">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#14151f" stroke-width="2"><path d="m5 12 14-7-4 14-4.5-5.5L5 12Z"/></svg>
            </button>
          </form>
        </section>

        <!-- پنل جستجوی معنایی -->
        <section id="pg-panel-search" class="flex-col bg-surface border border-line rounded-md min-h-[28rem] lg:min-h-0">
          <div class="px-5 py-3.5 border-b border-line">
            <p class="font-medium text-sm">جستجوی معنایی (Semantic Search)</p>
            <p class="text-xs text-muted mt-0.5">می‌بینی دقیقاً کدوم تکه‌متن‌ها بازیابی می‌شن</p>
          </div>

          <form id="search-form" class="p-3 border-b border-line">
            <input id="search-input" type="text"
              class="w-full bg-raised border border-line rounded-md px-3.5 py-2.5 text-sm focus:border-accent focus:outline-none"
              placeholder="query مورد نظرت رو بنویس و Enter بزن...">
          </form>

          <div id="search-results" class="flex-1 p-4 space-y-3 overflow-y-auto"></div>
        </section>

      </div>
    </main>
  </div>
</div>
<script src="js/playground.js"></script>
</body>
</html>
