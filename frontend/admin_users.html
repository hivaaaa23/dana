<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کاربران | دانا</title>
<link rel="stylesheet" href="tailwind.css">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<script src="js/api.js"></script>
</head>
<body class="bg-base text-ink font-sans">
<div class="flex min-h-screen">

  <!-- ===== سایدبار مدیریت ===== -->
  <aside class="w-60 shrink-0 bg-surface border-l border-line flex flex-col">
    <div class="h-16 flex items-center gap-2 px-5 border-b border-line">
      <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="5" r="2.4" fill="#e8a33d"/>
        <circle cx="5" cy="20" r="2.4" fill="#4dd6c4"/>
        <circle cx="23" cy="20" r="2.4" fill="#4dd6c4"/>
        <path d="M14 7.2 6.2 18.5M14 7.2 21.8 18.5M6.6 20h14.8" stroke="#2a2d3e" stroke-width="1.4"/>
      </svg>
      <span class="font-bold">دانا</span>
      <span class="text-[10px] text-accent bg-accent/10 border border-accent/30 rounded px-1.5 py-0.5 mr-auto">ادمین</span>
    </div>

    <nav class="flex-1 py-4 px-3 space-y-1 text-sm">
      <a href="admin_dashboard.html" class="nav-item flex items-center gap-2.5 px-3 py-2.5 rounded-md text-muted hover:text-ink">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        آمار کلان
      </a>
      <a href="admin_users.html" data-active="true" class="nav-item flex items-center gap-2.5 px-3 py-2.5 rounded-md text-ink">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        کاربران
      </a>
      <a href="admin_logs.html" class="nav-item flex items-center gap-2.5 px-3 py-2.5 rounded-md text-muted hover:text-ink">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>
        گزارش و امنیت
      </a>
    </nav>

    <div class="p-3 border-t border-line space-y-1">
      <a href="dashboard.html" class="flex items-center gap-2.5 px-3 py-2.5 rounded-md text-muted hover:text-ink text-sm transition">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        بازگشت به پنل کاربری
      </a>
      <a href="login.html" data-logout class="flex items-center gap-2.5 px-3 py-2.5 rounded-md text-muted hover:text-danger text-sm transition">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        خروج
      </a>
    </div>
  </aside>

  <!-- ===== محتوای اصلی ===== -->
  <div class="flex-1 flex flex-col min-w-0">

    <header class="h-16 border-b border-line flex items-center justify-between px-6 shrink-0">
      <h1 class="font-bold text-lg" id="page-title">کاربران</h1>
      <div data-avatar class="w-8 h-8 rounded-full bg-raised border border-line flex items-center justify-center text-xs font-medium">آ</div>
    </header>

    <main class="flex-1 p-6 space-y-4 overflow-y-auto enter">

      <div class="flex items-center gap-3 flex-wrap">
        <input id="u-q" type="text" placeholder="جستجو بر اساس ایمیل..."
          class="flex-1 min-w-[220px] bg-raised border border-line rounded-md px-3.5 py-2.5 text-sm focus:border-accent focus:outline-none">
        <select id="u-status" class="bg-raised border border-line rounded-md px-3 py-2.5 text-sm focus:border-accent focus:outline-none">
          <option value="">همه وضعیت‌ها</option><option value="active">فعال</option><option value="blocked">مسدود</option>
        </select>
        <select id="u-role" class="bg-raised border border-line rounded-md px-3 py-2.5 text-sm focus:border-accent focus:outline-none">
          <option value="">همه نقش‌ها</option><option value="user">کاربر</option><option value="admin">ادمین</option>
        </select>
      </div>

      <div class="bg-surface border border-line rounded-md overflow-hidden">
        <div class="grid grid-cols-12 gap-3 px-5 py-3 text-xs text-muted border-b border-line">
          <div class="col-span-4">کاربر</div>
          <div class="col-span-2">تاریخ عضویت</div>
          <div class="col-span-2">اسناد</div>
          <div class="col-span-1">نقش</div>
          <div class="col-span-1">وضعیت</div>
          <div class="col-span-2"></div>
        </div>
        <div id="u-list"></div>
      </div>
      <div class="flex items-center justify-between text-xs text-muted px-1">
        <span id="u-count"></span>
        <span class="flex gap-3"><button id="u-prev" class="hover:text-ink">قبلی</button><button id="u-next" class="hover:text-ink">بعدی</button></span>
      </div>

    </main>
  </div>
</div>


<script src="js/admin.js"></script>
</body>
</html>
