<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دسترسی غیرمجاز | دانا</title>
<link rel="stylesheet" href="tailwind.css">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body class="bg-base text-ink font-sans min-h-screen flex items-center justify-center vector-field p-6">

  <main class="enter w-full max-w-md text-center">
    <div class="flex items-center justify-center gap-2 mb-8">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="5" r="2.4" fill="#e8a33d"/>
        <circle cx="5" cy="20" r="2.4" fill="#4dd6c4"/>
        <circle cx="23" cy="20" r="2.4" fill="#4dd6c4"/>
        <path d="M14 7.2 6.2 18.5M14 7.2 21.8 18.5M6.6 20h14.8" stroke="#2a2d3e" stroke-width="1.4"/>
      </svg>
      <span class="text-lg font-bold">دانا</span>
    </div>

    <div class="bg-surface border border-line rounded-md p-8">
      <div class="w-14 h-14 mx-auto rounded-full bg-danger/10 border border-danger/30 flex items-center justify-center mb-5">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="text-danger"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      </div>
      <p class="font-bold mb-1.5">دسترسی غیرمجاز <span class="ltr-num text-muted font-normal">(۴۰۳)</span></p>
      <p class="text-sm text-muted leading-7">
        این بخش فقط برای مدیران سامانه در دسترسه. اگه فکر می‌کنی این یه اشتباهه،
        با ادمین سازمانت تماس بگیر.
      </p>
      <a href="dashboard.html"
        class="inline-block mt-6 bg-accent text-base font-bold rounded-md px-5 py-2.5 text-sm hover:brightness-110 transition">
        بازگشت به پنل کاربری
      </a>
    </div>
  </main>

<!--
  نکته برای نفر ۱ (خودت، بعداً):
  - این صفحه رو باید سمت بک‌اند/میدلور برای مسیرها و APIهای admin_* سروش
    کنه، وقتی نقش کاربر Admin نیست (خطای ۴۰۱ برای عدم احراز هویت، ۴۰۳ برای
    عدم دسترسی با وجود احراز هویت).
-->
