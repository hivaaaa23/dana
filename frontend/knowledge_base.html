<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مخزن دانش | دانا</title>
<link rel="stylesheet" href="tailwind.css">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<script src="js/api.js"></script>
</head>
<body class="bg-base text-ink font-sans">
<div class="flex min-h-screen">

  <!-- ===== سایدبار ===== -->
  <aside class="w-60 shrink-0 bg-surface border-l border-line flex flex-col">
    <div class="h-16 flex items-center gap-2 px-5 border-b border-line">
      <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="5" r="2.4" fill="#e8a33d"/>
        <circle cx="5" cy="20" r="2.4" fill="#4dd6c4"/>
        <circle cx="23" cy="20" r="2.4" fill="#4dd6c4"/>
        <path d="M14 7.2 6.2 18.5M14 7.2 21.8 18.5M6.6 20h14.8" stroke="#2a2d3e" stroke-width="1.4"/>
      </svg>
      <span class="font-bold">دانا</span>
    </div>

    <nav class="flex-1 py-4 px-3 space-y-1 text-sm">
      <a href="dashboard.html" class="nav-item flex items-center gap-2.5 px-3 py-2.5 rounded-md text-muted hover:text-ink">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>
        داشبورد
      </a>
      <a href="connection.html" class="nav-item flex items-center gap-2.5 px-3 py-2.5 rounded-md text-muted hover:text-ink">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v4M15 3v4"/><path d="M6 7h12v3a6 6 0 0 1-12 0V7Z"/><path d="M12 16v5"/></svg>
        اتصال مدل
      </a>
      <a href="knowledge_base.html" data-active="true" class="nav-item flex items-center gap-2.5 px-3 py-2.5 rounded-md text-ink">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3Z"/><path d="M4 7v10c0 1.7 3.6 3 8 3s8-1.3 8-3V7"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
        مخزن دانش
      </a>
      <a href="settings.html" class="nav-item flex items-center gap-2.5 px-3 py-2.5 rounded-md text-muted hover:text-ink">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 18h2M8 18h12M4 12h6M14 12h6"/><circle cx="16" cy="6" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></svg>
        شخصی‌سازی و ویجت
      </a>
      <a href="playground.html" class="nav-item flex items-center gap-2.5 px-3 py-2.5 rounded-md text-muted hover:text-ink">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5.5 9.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-2.5L14 9V3"/><path d="M7.5 15h9"/></svg>
        آزمایشگاه
      </a>
    </nav>

    <div class="p-3 border-t border-line space-y-1">
      <a href="login.html" data-logout class="flex items-center gap-2.5 px-3 py-2.5 rounded-md text-muted hover:text-danger text-sm transition">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        خروج
      </a>
    </div>
  </aside>

  <!-- ===== محتوای اصلی ===== -->
  <div class="flex-1 flex flex-col min-w-0">

    <header class="h-16 border-b border-line flex items-center justify-between px-6 shrink-0">
      <h1 class="font-bold text-lg">مخزن دانش</h1>
      <div data-avatar class="w-8 h-8 rounded-full bg-raised border border-line flex items-center justify-center text-xs font-medium">آ</div>
    </header>

    <main class="flex-1 p-6 space-y-6 overflow-y-auto enter">

      <div class="flex items-start justify-between gap-4 flex-wrap">
        <p class="text-muted text-sm max-w-md">
          هر سندی که این‌جا اضافه کنی، به تکه‌های کوچیک شکسته و در پایگاه‌داده‌ی برداری ذخیره می‌شه
          تا چت‌بات موقع جواب دادن بهش رجوع کنه.
        </p>
        <button id="add-doc" type="button" class="shrink-0 bg-accent text-base font-bold text-sm rounded-md px-4 py-2.5 hover:brightness-110 transition flex items-center gap-1.5">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          افزودن سند
        </button>
      </div>

      <!-- ناحیه آپلود (فعلاً فقط فایل متنی) -->
      <label id="dropzone" class="dropzone rounded-md flex flex-col items-center justify-center text-center py-10 px-6 cursor-pointer">
        <input id="file-input" type="file" class="hidden" multiple accept=".txt,.md,.markdown,.pdf,.docx">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="text-muted mb-3"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        <p class="text-sm">فایل رو بکش و رها کن، یا <span class="text-cyan">از روی سیستم انتخاب کن</span></p>
        <p class="text-xs text-muted mt-1.5">TXT، Markdown، PDF و DOCX — حداکثر ۱۰ مگابایت (PDF اسکن‌شده/تصویری پشتیبانی نمی‌شود)</p>
      </label>

      <!-- لیست اسناد -->
      <div class="bg-surface border border-line rounded-md overflow-hidden">
        <div class="grid grid-cols-12 gap-3 px-5 py-3 text-xs text-muted border-b border-line">
          <div class="col-span-6">نام سند</div>
          <div class="col-span-2">تعداد Chunk</div>
          <div class="col-span-3">تاریخ افزودن</div>
          <div class="col-span-1"></div>
        </div>
        <div id="doc-list"><div class="py-14 text-center text-muted text-sm">در حال بارگذاری...</div></div>
      </div>

      <div class="flex items-center justify-between text-xs text-muted px-1">
        <span id="doc-count"></span>
        <button id="delete-all" type="button" class="text-danger hover:underline" style="visibility:hidden">حذف کامل مخزن دانش</button>
      </div>

    </main>

    <!-- مودال افزودن/ویرایش -->
    <dialog id="doc-modal" class="g-modal">
      <form id="doc-form" class="space-y-4">
        <h3 id="modal-title" class="font-bold">افزودن سند</h3>
        <div>
          <label class="block text-sm text-muted mb-1.5" for="m-title">عنوان</label>
          <input id="m-title" required maxlength="255" type="text" class="w-full bg-raised border border-line rounded-md px-3.5 py-2.5 text-sm focus:border-accent focus:outline-none">
        </div>
        <div>
          <label class="block text-sm text-muted mb-1.5" for="m-content">متن سند</label>
          <textarea id="m-content" required rows="10" class="w-full bg-raised border border-line rounded-md px-3.5 py-3 text-sm leading-7 focus:border-accent focus:outline-none resize-y"></textarea>
        </div>
        <div class="flex justify-end gap-2">
          <button id="m-cancel" type="button" class="px-4 py-2.5 rounded-md border border-line text-sm text-muted hover:text-ink">انصراف</button>
          <button id="m-save" type="submit" class="bg-accent text-base font-bold text-sm rounded-md px-5 py-2.5 hover:brightness-110 transition">ذخیره</button>
        </div>
      </form>
    </dialog>
  </div>
</div>
<script src="js/knowledge_base.js"></script>
</body>
</html>
